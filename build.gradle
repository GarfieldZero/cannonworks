plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

// NeoForge 21.1 要求 Java 21；Gradle 自身也用 JDK 21 跑（JDK 17 只够老分支）
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            // 客户端单独一个游戏目录：和服务器共用一个会抢 logs/latest.log
            gameDirectory = project.file('run-1.21.1-client')
        }
        server {
            server()
            gameDirectory = project.file('run-1.21.1')
            programArguments = ['--nogui']
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        cannonworks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // JUnit 走阿里云镜像：本机直连 Maven Central 的 JVM TLS 握手过不去
    maven {
        url = 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex 'org\\.junit.*'
            includeGroupByRegex 'org\\.opentest4j.*'
            includeGroupByRegex 'org\\.apiguardian.*'
        }
    }
    // 1.21.1 联动模组 jar（不入库；运行期另放 run-1.21.1/mods）
    flatDir { dir 'libs-1.21.1' }
}

configurations {
    junitRuntime
}

dependencies {
    // 软依赖：编译期只要类签名；运行期把 jar 放进 run-1.21.1/mods/
    compileOnly fileTree(dir: 'libs-1.21.1', include: '*.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    junitRuntime 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()

    // 纯逻辑测试不加载 Minecraft：classpath 只给测试/主输出和 JUnit。
    // 这样也能绕开「中文项目路径 + Gradle worker argfile 编码」的老坑，原因见 1.20.1 分支的记录。
    classpath = files(sourceSets.test.output, sourceSets.main.output) + configurations.junitRuntime

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('processResources', ProcessResources).configure {
    // daemon 用平台默认字符集，资源过滤显式钉 UTF-8，别让中文描述写坏
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
