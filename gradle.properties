# Gradle JVM: 1.21.1/NeoForge 的编译与运行需要 JDK 21（用 JAVA_HOME 指向 Temurin 21）。
# JDK 18+ 默认 file.encoding=UTF-8（JEP 400），但 Gradle 给测试 worker 写 classpath argfile
# 用的是本 JVM 默认字符集，而 java.exe 读 argfile 用系统代码页（GBK）；项目路径含中文时
# 两者必须一致，所以这里显式把 daemon 钉回 GBK，否则测试类直接 ClassNotFoundException。
# 需要 UTF-8 的地方在 build.gradle 显式钉住：compileJava.options.encoding 与 processResources.filteringCharset。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=GBK
org.gradle.daemon=false
org.gradle.parallel=false

## Environment versions（1.21.1 + NeoForge 分支）
minecraft_version=1.21.1
neoforge_version=21.1.265

## Linked mods (jars live in libs-1.21.1/, not committed)
waystones_version=21.1.46
balm_version=21.0.66

## Mod metadata
mod_id=cannonworks
mod_name=Cannon Works
