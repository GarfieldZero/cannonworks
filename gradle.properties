# Gradle JVM: Minecraft decompilation needs a bigger heap.
# -Dfile.encoding=UTF-8 keeps processResources output (mods.toml) in UTF-8.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

## Environment versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.1
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Linked mods (jars live in libs/, see README)
waystones_version=14.1.21
balm_version=7.3.44

## Mod metadata
mod_id=cannonworks
mod_name=Cannon Works
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.cannonworks
mod_authors=Cannon Works Team
# Chinese description via \uXXXX escapes (gradle.properties is read as ISO-8859-1):
# "大炮主题模组，与传送石碑（Waystones）联动。"
mod_description=\u5927\u70AE\u4E3B\u9898\u6A21\u7EC4\uFF0C\u4E0E\u4F20\u9001\u77F3\u7891\uFF08Waystones\uFF09\u8054\u52A8\u3002\nCannon-themed mod with Waystones integration.
