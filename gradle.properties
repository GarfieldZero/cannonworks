# Gradle JVM: Minecraft decompilation needs a bigger heap.
# 这里刻意不再加 -Dfile.encoding=UTF-8：
# Gradle 给测试 worker 写 classpath argfile 时用的是本 JVM 的默认字符集，而 java.exe
# 读 argfile 用的是系统代码页（中文 Windows 上是 GBK）。项目路径含中文时两者要一致，
# 否则 argfile 里的路径全变乱码，单元测试直接 ClassNotFoundException。
# 需要 UTF-8 的地方在 build.gradle 里显式钉住：编译用 options.encoding，资源过滤用 filteringCharset。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false

## Environment versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.1
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Linked mods (jars live in libs/, see README)
waystones_version=14.1.21
balm_version=7.3.44

## Mod metadata
mod_id=cannonworks
mod_name=Cannon Works
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.cannonworks
