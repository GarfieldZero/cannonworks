mod_description=\u5927\u70AE\u4E3B\u9898\u6A21\u7EC4\uFF0C\u4E0E\u4F20\u9001\u77F3\u7891\uFF08Waystones\uFF09\u8054\u52A8\u3002\nCannon-themed mod with Waystones integration.
