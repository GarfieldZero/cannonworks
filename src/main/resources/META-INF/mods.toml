modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="GarfieldZero and Whale Maid (AI assistant)"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Waystones is a SOFT dependency: the mod loads fine without it,
# and the integration code is only touched when the mod is present.
[[dependencies.${mod_id}]]
    modId="waystones"
    mandatory=false
    versionRange="[14.0.0,)"
    ordering="AFTER"
    side="BOTH"
